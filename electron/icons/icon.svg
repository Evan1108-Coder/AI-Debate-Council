<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Liquid glass background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>

    <!-- Glass overlay -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
    </linearGradient>

    <!-- Accent glow -->
    <radialGradient id="glow1" cx="35%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(100,150,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(100,150,255,0)"/>
    </radialGradient>

    <radialGradient id="glow2" cx="65%" cy="60%" r="45%">
      <stop offset="0%" stop-color="rgba(180,120,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(180,120,255,0)"/>
    </radialGradient>

    <!-- Pillar gradient - Pro (blue) -->
    <linearGradient id="pillarPro" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Pillar gradient - Con (purple) -->
    <linearGradient id="pillarCon" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- Scale/balance gradient -->
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Inner glass reflection -->
    <linearGradient id="innerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="rgba(0,0,0,0.4)"/>
    </filter>

    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main rounded square background -->
  <rect x="40" y="40" width="944" height="944" rx="212" ry="212" fill="url(#bg)" filter="url(#dropShadow)"/>

  <!-- Background glow effects -->
  <rect x="40" y="40" width="944" height="944" rx="212" ry="212" fill="url(#glow1)"/>
  <rect x="40" y="40" width="944" height="944" rx="212" ry="212" fill="url(#glow2)"/>

  <!-- Glass overlay -->
  <rect x="40" y="40" width="944" height="944" rx="212" ry="212" fill="url(#glass)"/>

  <!-- Border highlight -->
  <rect x="42" y="42" width="940" height="940" rx="210" ry="210"
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Top highlight arc for liquid glass effect -->
  <path d="M252,44 Q512,44 772,44 Q978,44 982,252 Q982,120 772,60 Q512,44 252,60 Q80,120 44,252 Q44,44 252,44"
        fill="rgba(255,255,255,0.06)" />

  <!-- Classical pillars - Left (Pro) -->
  <g transform="translate(220, 340)">
    <!-- Pillar base -->
    <rect x="-15" y="280" width="110" height="30" rx="4" fill="url(#pillarPro)" opacity="0.9"/>
    <!-- Pillar shaft -->
    <rect x="5" y="40" width="70" height="240" rx="6" fill="url(#pillarPro)" opacity="0.85"/>
    <!-- Pillar capital -->
    <rect x="-10" y="20" width="100" height="25" rx="6" fill="url(#pillarPro)" opacity="0.9"/>
    <!-- Pillar cap detail -->
    <rect x="-5" y="10" width="90" height="15" rx="4" fill="rgba(147,197,253,0.7)"/>
    <!-- Glass shine on pillar -->
    <rect x="15" y="50" width="20" height="220" rx="10" fill="rgba(255,255,255,0.15)"/>
  </g>

  <!-- Classical pillars - Right (Con) -->
  <g transform="translate(724, 340)">
    <!-- Pillar base -->
    <rect x="-15" y="280" width="110" height="30" rx="4" fill="url(#pillarCon)" opacity="0.9"/>
    <!-- Pillar shaft -->
    <rect x="5" y="40" width="70" height="240" rx="6" fill="url(#pillarCon)" opacity="0.85"/>
    <!-- Pillar capital -->
    <rect x="-10" y="20" width="100" height="25" rx="6" fill="url(#pillarCon)" opacity="0.9"/>
    <!-- Pillar cap detail -->
    <rect x="-5" y="10" width="90" height="15" rx="4" fill="rgba(196,181,253,0.7)"/>
    <!-- Glass shine on pillar -->
    <rect x="15" y="50" width="20" height="220" rx="10" fill="rgba(255,255,255,0.15)"/>
  </g>

  <!-- Balance / Scale in the center -->
  <g filter="url(#glowFilter)">
    <!-- Center post -->
    <line x1="512" y1="280" x2="512" y2="420" stroke="url(#scaleGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Triangle top -->
    <polygon points="512,260 496,290 528,290" fill="url(#scaleGrad)" opacity="0.9"/>

    <!-- Balance beam -->
    <line x1="380" y1="340" x2="644" y2="340" stroke="url(#scaleGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Left pan chain -->
    <line x1="400" y1="340" x2="390" y2="390" stroke="rgba(147,197,253,0.6)" stroke-width="2"/>
    <line x1="420" y1="340" x2="430" y2="390" stroke="rgba(147,197,253,0.6)" stroke-width="2"/>

    <!-- Left pan -->
    <ellipse cx="410" cy="400" rx="45" ry="12" fill="rgba(96,165,250,0.4)" stroke="rgba(147,197,253,0.5)" stroke-width="1.5"/>

    <!-- Right pan chain -->
    <line x1="604" y1="340" x2="594" y2="390" stroke="rgba(196,181,253,0.6)" stroke-width="2"/>
    <line x1="624" y1="340" x2="634" y2="390" stroke="rgba(196,181,253,0.6)" stroke-width="2"/>

    <!-- Right pan -->
    <ellipse cx="614" cy="400" rx="45" ry="12" fill="rgba(167,139,250,0.4)" stroke="rgba(196,181,253,0.5)" stroke-width="1.5"/>
  </g>

  <!-- AI Circuit nodes (floating elements) -->
  <g opacity="0.6">
    <circle cx="320" cy="500" r="5" fill="#60a5fa"/>
    <circle cx="370" cy="520" r="4" fill="#93c5fd"/>
    <circle cx="340" cy="560" r="3" fill="#60a5fa"/>
    <line x1="320" y1="500" x2="370" y2="520" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
    <line x1="370" y1="520" x2="340" y2="560" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>

    <circle cx="704" cy="500" r="5" fill="#a78bfa"/>
    <circle cx="654" cy="520" r="4" fill="#c4b5fd"/>
    <circle cx="684" cy="560" r="3" fill="#a78bfa"/>
    <line x1="704" y1="500" x2="654" y2="520" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
    <line x1="654" y1="520" x2="684" y2="560" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
  </g>

  <!-- "AI" text mark -->
  <text x="512" y="510" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="80" font-weight="700" fill="url(#scaleGrad)" text-anchor="middle"
        letter-spacing="-2" opacity="0.9">AI</text>

  <!-- Debate subtitle -->
  <text x="512" y="570" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="36" font-weight="500" fill="rgba(226,232,240,0.7)" text-anchor="middle"
        letter-spacing="8">DEBATE</text>

  <!-- Council subtitle -->
  <text x="512" y="620" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="28" font-weight="400" fill="rgba(226,232,240,0.45)" text-anchor="middle"
        letter-spacing="12">COUNCIL</text>

  <!-- Speech bubble indicators - left -->
  <g opacity="0.5" transform="translate(180, 700)">
    <rect x="0" y="0" width="120" height="50" rx="12" fill="rgba(96,165,250,0.15)" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
    <line x1="20" y1="18" x2="100" y2="18" stroke="rgba(96,165,250,0.4)" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="32" x2="75" y2="32" stroke="rgba(96,165,250,0.3)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="40,50 55,50 45,65" fill="rgba(96,165,250,0.15)"/>
  </g>

  <!-- Speech bubble indicators - right -->
  <g opacity="0.5" transform="translate(724, 700)">
    <rect x="0" y="0" width="120" height="50" rx="12" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
    <line x1="20" y1="18" x2="100" y2="18" stroke="rgba(167,139,250,0.4)" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="32" x2="75" y2="32" stroke="rgba(167,139,250,0.3)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="65,50 80,50 75,65" fill="rgba(167,139,250,0.15)"/>
  </g>

  <!-- Bottom gavel hint -->
  <g opacity="0.4" transform="translate(462, 700)">
    <rect x="0" y="10" width="100" height="12" rx="6" fill="rgba(226,232,240,0.3)"/>
    <rect x="30" y="0" width="40" height="30" rx="6" fill="rgba(226,232,240,0.2)" stroke="rgba(226,232,240,0.25)" stroke-width="1"/>
  </g>

  <!-- Top inner highlight for glass depth -->
  <ellipse cx="512" cy="180" rx="300" ry="80" fill="rgba(255,255,255,0.03)"/>
</svg>
